name: Publicar Contex Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar arquivos públicos
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          cp -R css _site/css
          cp -R js _site/js
          cp -R pages _site/pages
          touch _site/.nojekyll

      - name: Enviar arquivos para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

